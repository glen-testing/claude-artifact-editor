[package]
name = "claude-artifact-editor"
version = "0.3.0"
description = "WYSIWYG editor for Claude Artifact HTML pages"
authors = ["glen-testing"]
edition = "2024"

[lib]
name = "claude_artifact_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
